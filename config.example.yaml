# Hypothesis Forge configuration template.
# Copy this file to config.yaml for local runs:
#   cp config.example.yaml config.yaml
#
# Keep config.yaml private. It may contain local API keys, provider URLs, and
# experiment defaults that should not be committed.

# LLM profiles
# thinking_llm is used for planning, hypothesis generation, evolution, literature
# query planning, and prior-art repair.
thinking_llm:
  providers:
    - api_key: null
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1"

# critic_llm is used for safety checks, reflection, pairwise ranking, and
# meta-review. Add more providers in order; if one fails, the next is tried.
critic_llm:
  providers:
    - api_key: null
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1"
    # - api_key: null
    #   base_url: "https://openrouter.ai/api/v1"
    #   model: "openai/gpt-4.1"

llm_retry_until_success: true
max_retries: 2
initial_retry_delay: 2
max_retry_delay_seconds: 60

# Default run controls. A normal run needs --goal, --reference-arxiv, and --output-dir.
cycles: 5
output_dir: "results"
num_hypotheses: 5
top_k_hypotheses: 3
max_literature_results: 6
ranking_matches_per_cycle: 1000
# Keep network/search breadth unchanged, but serialize memory-heavy local work.
max_concurrency: 1

# Scoring, review, reranking, and lifecycle controls
elo_k_factor: 32
proximity_similarity_threshold: 0.55
hypothesis_decay_fraction: 0.0
enable_opencode_reranking: true
opencode_rerank_timeout_seconds: 900
enable_safety_review: true
enable_prior_art_check: true
# One full-cycle OR query is sent to each paper source before local recall.
cycle_literature_terms_per_idea: 6
cycle_literature_shared_terms: 12
cycle_literature_results_per_query: 1000
literature_or_terms_per_query: 4
prior_art_embedding_candidates: 200
prior_art_review_top_k: 12
prior_art_similarity_threshold: 0.38
prior_art_repair_attempts: 1
prior_art_include_cache_corpus: true
prior_art_vector_index_path: ".cache/prior_art_vector_index.npz"
prior_art_vector_index_backend: "numpy"
prior_art_vector_batch_size: 2
prior_art_vector_search_chunk_size: 4000

# Literature grounding and cache
literature_sources:
  - semantic_scholar
  - arxiv
literature_cache_path: ".cache/literature_search_cache.json"
arxiv_state_path: ".cache/arxiv_search_state.json"
semantic_scholar_api_key: null
semantic_scholar_timeout_seconds: 8
semantic_scholar_min_delay_seconds: 2.0
semantic_scholar_max_retries: 1
semantic_scholar_retry_after_seconds: 20.0
arxiv_rate_limit_max_retries: 1
arxiv_rate_limit_retry_after_seconds: 20.0
arxiv_failure_cooldown_seconds: 900
arxiv_max_consecutive_failures: 3
arxiv_max_terms_per_clause: 8
reference_arxiv_timeout_seconds: 180
reference_markdown_char_limit: 24000

# Semantic similarity model used for prior-art recall and hypothesis proximity.
sentence_transformer_enabled: true
sentence_transformer_model: "BAAI/bge-small-en-v1.5"
sentence_transformer_local_files_only: false
# MPS has a much higher peak memory footprint for this workload.
sentence_transformer_device: "cpu"
prior_art_query_prefix: ""
prior_art_document_prefix: ""

# Temperature defaults by workflow stage.
step_temperatures:
  generation: 0.84
  evolution: 0.68
  reflection: 0.3

logging_level: "INFO"
