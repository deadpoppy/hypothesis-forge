# Hypothesis Forge configuration template.
# Copy this file to config.yaml for local runs:
#   cp config.example.yaml config.yaml
#
# Keep config.yaml private. It may contain local API keys, provider URLs, and
# experiment defaults that should not be committed.

# LLM profiles
# thinking_llm is used for planning, hypothesis generation, and evolution.
thinking_llm:
  providers:
    - api_key: null
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1"

# critic_llm is used for safety checks, reflection, pairwise ranking, and
# meta-review. Add more providers in order; if one fails, the next is tried.
critic_llm:
  providers:
    - api_key: null
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1"
    # - api_key: null
    #   base_url: "https://openrouter.ai/api/v1"
    #   model: "openai/gpt-4.1"

llm_retry_until_success: true
max_retries: 2
initial_retry_delay: 2
max_retry_delay_seconds: 60

# Default run controls. A normal run needs --goal, --reference-arxiv, and --output-dir.
cycles: 5
output_dir: "results"
num_hypotheses: 5
top_k_hypotheses: 3
max_literature_results: 6
ranking_matches_per_cycle: 1000
# LLM, ranking, review, and OpenCode request concurrency.
max_concurrency: 16
# Local SentenceTransformer concurrency for hypothesis similarity.
embedding_concurrency: 1

# Scoring, review, reranking, and lifecycle controls
elo_k_factor: 32
proximity_similarity_threshold: 0.55
hypothesis_decay_fraction: 0.0
enable_opencode_reranking: true
opencode_rerank_timeout_seconds: 900
enable_safety_review: true
# Fetch related papers once per idea through OpenCode.
enable_idea_literature: true
opencode_literature_timeout_seconds: 900
opencode_literature_max_papers: 6

# Required reference-paper conversion
reference_arxiv_timeout_seconds: 180
reference_markdown_char_limit: 24000

# Semantic similarity model used for hypothesis deduplication and proximity.
sentence_transformer_enabled: true
sentence_transformer_model: "BAAI/bge-small-en-v1.5"
sentence_transformer_local_files_only: false
# MPS has a much higher peak memory footprint for this workload.
sentence_transformer_device: "cpu"

# Temperature defaults by workflow stage.
step_temperatures:
  generation: 0.84
  evolution: 0.68
  reflection: 0.3

logging_level: "INFO"
