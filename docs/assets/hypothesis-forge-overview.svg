<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Hypothesis Forge workflow overview</title>
  <desc id="desc">A compact diagram showing how Hypothesis Forge turns a research goal into plans, literature-grounded hypotheses, ranking, trajectory diagnostics, and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.56" stop-color="#19212c"/>
      <stop offset="1" stop-color="#243129"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40c4b0"/>
      <stop offset="1" stop-color="#f2c94c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="54" y="54" width="1172" height="532" rx="22" fill="#f8faf7" opacity="0.06" stroke="#ffffff" stroke-opacity="0.13"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="96" y="128" fill="#f9fbf8" font-size="54" font-weight="750">Hypothesis Forge</text>
    <text x="99" y="166" fill="#d7e5df" font-size="22">LLM-driven research ideation with literature grounding, ranking, and trajectory diagnostics.</text>
    <rect x="98" y="194" width="438" height="8" rx="4" fill="url(#accent)"/>

    <g filter="url(#shadow)">
      <rect x="96" y="258" width="220" height="132" rx="14" fill="#ffffff"/>
      <rect x="96" y="258" width="220" height="132" rx="14" fill="#40c4b0" opacity="0.08"/>
      <text x="122" y="307" fill="#14212a" font-size="19" font-weight="700">Research Goal</text>
      <text x="122" y="340" fill="#46545d" font-size="15">Plain-language target</text>
      <text x="122" y="363" fill="#46545d" font-size="15">plus optional constraints</text>

      <rect x="374" y="258" width="220" height="132" rx="14" fill="#ffffff"/>
      <rect x="374" y="258" width="220" height="132" rx="14" fill="#f2c94c" opacity="0.12"/>
      <text x="400" y="307" fill="#14212a" font-size="19" font-weight="700">Plan + Literature</text>
      <text x="400" y="340" fill="#46545d" font-size="15">Structured directions</text>
      <text x="400" y="363" fill="#46545d" font-size="15">from arXiv and Scholar</text>

      <rect x="652" y="258" width="220" height="132" rx="14" fill="#ffffff"/>
      <rect x="652" y="258" width="220" height="132" rx="14" fill="#7aa2ff" opacity="0.11"/>
      <text x="678" y="307" fill="#14212a" font-size="19" font-weight="700">Generate + Evolve</text>
      <text x="678" y="340" fill="#46545d" font-size="15">Hypothesis cycles</text>
      <text x="678" y="363" fill="#46545d" font-size="15">with lineage tracking</text>

      <rect x="930" y="258" width="220" height="132" rx="14" fill="#ffffff"/>
      <rect x="930" y="258" width="220" height="132" rx="14" fill="#e97979" opacity="0.10"/>
      <text x="956" y="307" fill="#14212a" font-size="19" font-weight="700">Rank + Report</text>
      <text x="956" y="340" fill="#46545d" font-size="15">Critic review, ELO</text>
      <text x="956" y="363" fill="#46545d" font-size="15">Markdown and JSON</text>
    </g>

    <g fill="none" stroke="#dce8e3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M324 324H362"/>
      <path d="M354 316l10 8-10 8"/>
      <path d="M602 324H640"/>
      <path d="M632 316l10 8-10 8"/>
      <path d="M880 324H918"/>
      <path d="M910 316l10 8-10 8"/>
    </g>

    <g>
      <rect x="104" y="450" width="1046" height="60" rx="12" fill="#0b1117" opacity="0.72" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="132" y="487" fill="#eaf3ee" font-size="19" font-family="'SFMono-Regular', Consolas, monospace">cp config.example.yaml config.yaml &amp;&amp; python app.py --goal "..." --output-dir results/run</text>
    </g>
    <text x="100" y="548" fill="#b9cbc2" font-size="17">Two LLM profiles. No committed private config. Optional embedding extras only when you need them.</text>
  </g>
</svg>
